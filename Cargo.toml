[package]
name = "contrib-inbox"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { package = "gpui-unofficial", version = "1.21.0-pre" }
gpui_web = { package = "gpui-web-gpui-unofficial", version = "1.21.0-pre", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Storage",
    "Navigator",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "History",
    "UrlSearchParams",
] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
console_error_panic_hook = "0.1.7"
time = { version = "0.3", features = ["parsing", "formatting"] }
